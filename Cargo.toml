[package]
name = "projector-usb"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Video audio conversion GUI for projector USB media"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui_extras = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
globset = "0.4"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[profile.release]
lto = "thin"
strip = true
